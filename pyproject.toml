[project]
name = "kaggle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.2",
    "lightning>=2.6.6",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "ruff>=0.17.0",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "tensorboard>=2.21.0",
    "transformers>=5.19.0",
]

[project.scripts]
kaggle = "kaggle:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
